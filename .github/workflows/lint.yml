name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Each check runs even if an earlier one fails, so one run reports everything.
      - name: Stylelint
        run: npm run lint:css

      - name: Markuplint
        if: ${{ !cancelled() }}
        run: npm run lint:html

      - name: ESLint
        if: ${{ !cancelled() }}
        run: npm run lint:js

      - name: Prettier
        if: ${{ !cancelled() }}
        run: npm run format:check
