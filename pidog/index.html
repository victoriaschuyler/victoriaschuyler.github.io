<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; media-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self';">

        <link rel="canonical" href="https://victoriaschuyler.github.io/pidog/">

        <title>PiDog July 2026</title>

        <link rel="icon" href="/favicon.ico?v=2" type="image/x-icon">
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">

        <meta name="robots" content="index, follow">
        <meta name="author" content="Victoria Schuyler">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <link rel="stylesheet" href="/css/global.css">
        <link rel="stylesheet" href="/css/pidog.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Righteous&family=Space+Grotesk:wght@300;400;500;600;700&display=swap">

        <script src="/js/pidog.js" defer></script>
    </head>

    <body>
        <main class="pidog">
            <p class="pidog-home">
                <a class="pidog-home-link" href="/" aria-label="Home">← 🏡</a>
            </p>

            <h1><span class="pidog-name">PiDog</span> <span class="pidog-date">July 2026</span></h1>

            <section class="clip" aria-labelledby="push-ups-title">
                <h2 id="push-ups-title">Push-ups</h2>
                <video controls playsinline preload="metadata" poster="/assets/images/pidog/push-ups.jpg" width="720" height="1280" aria-labelledby="push-ups-title">
                    <source src="/assets/videos/pidog/push-ups.mp4" type="video/mp4">
                    <a href="/assets/videos/pidog/push-ups.mp4">Push-ups</a>
                </video>
            </section>

            <section class="clip" aria-labelledby="howl-title">
                <h2 id="howl-title">Howl</h2>
                <video controls playsinline preload="metadata" poster="/assets/images/pidog/howl.jpg" width="720" height="1280" aria-labelledby="howl-title">
                    <source src="/assets/videos/pidog/howl.mp4" type="video/mp4">
                    <a href="/assets/videos/pidog/howl.mp4">Howl</a>
                </video>
            </section>

            <section class="clip" aria-labelledby="patrol-title">
                <h2 id="patrol-title">Patrol</h2>
                <video controls playsinline preload="metadata" poster="/assets/images/pidog/patrol.jpg" width="720" height="1280" aria-labelledby="patrol-title">
                    <source src="/assets/videos/pidog/patrol.mp4" type="video/mp4">
                    <a href="/assets/videos/pidog/patrol.mp4">Patrol</a>
                </video>
            </section>

            <section class="clip" aria-labelledby="superdog-title">
                <h2 id="superdog-title">Superdog</h2>
                <video controls playsinline preload="metadata" poster="/assets/images/pidog/superdog.jpg" width="720" height="1280" aria-labelledby="superdog-title">
                    <source src="/assets/videos/pidog/superdog.mp4" type="video/mp4">
                    <a href="/assets/videos/pidog/superdog.mp4">Superdog</a>
                </video>
            </section>

            <section class="clip" aria-labelledby="paw-title">
                <h2 id="paw-title">Paw</h2>
                <video controls playsinline preload="metadata" poster="/assets/images/pidog/paw.jpg" width="720" height="1280" aria-labelledby="paw-title">
                    <source src="/assets/videos/pidog/paw.mp4" type="video/mp4">
                    <a href="/assets/videos/pidog/paw.mp4">Paw</a>
                </video>
            </section>
        </main>
    </body>
</html>
