<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self'; media-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pi Traffic Light Simulator May 2026</title>

    <meta name="author" content="Victoria Schuyler" />
    <meta name="robots" content="index, follow" />
    <link
      rel="canonical"
      href="https://victoriaschuyler.github.io/traffic-simulator/"
    />

    <link rel="icon" href="/favicon.ico?v=2" type="image/x-icon" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/icons/apple-touch-icon.png?v=2"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/project.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Limelight&family=Righteous&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    />

    <script src="/js/project.js" defer></script>
  </head>

  <body>
    <main class="project">
      <p class="project-home">
        <a class="project-home-link" href="/"
          ><span role="img" aria-label="Home">← 🏡</span></a
        >
      </p>

      <h1 class="project-title-one-line">
        <span class="project-name">Pi Traffic Light Simulator</span>
        <span class="project-date">May 2026</span>
      </h1>

      <section class="clip" aria-label="Traffic Light Simulator">
        <video
          controls
          playsinline
          preload="metadata"
          poster="/assets/images/traffic-simulator/pi-traffic-light-simulator.jpg"
          width="360"
          height="640"
          aria-label="Traffic Light Simulator"
        >
          <source
            src="/assets/videos/traffic-simulator/pi-traffic-light-simulator.mp4"
            type="video/mp4"
          />
          <a
            href="/assets/videos/traffic-simulator/pi-traffic-light-simulator.mp4"
            >Traffic Light Simulator</a
          >
        </video>
      </section>
    </main>
  </body>
</html>
