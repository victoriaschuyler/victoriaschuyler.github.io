<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self'; media-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>xArm 1S October 2026</title>

    <meta name="author" content="Victoria Schuyler" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://victoriaschuyler.github.io/xarm/" />

    <link rel="icon" href="/favicon.ico?v=2" type="image/x-icon" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/icons/apple-touch-icon.png?v=2"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/pidog.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Limelight&family=Righteous&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    />

    <script src="/js/pidog.js" defer></script>
  </head>

  <body>
    <main class="pidog">
      <p class="pidog-home">
        <a class="pidog-home-link" href="/"
          ><span role="img" aria-label="Home">← 🏡</span></a
        >
      </p>

      <h1>
        <span class="pidog-name">xArm 1S</span>
        <span class="pidog-date">October 2026</span>
      </h1>

      <section class="clip" aria-label="Pick Up Block">
        <video
          class="landscape"
          controls
          playsinline
          preload="metadata"
          poster="/assets/images/xarm/pick-up-block.jpg"
          width="1280"
          height="720"
          aria-label="Pick Up Block"
        >
          <source
            src="/assets/videos/xarm/pick-up-block.mp4"
            type="video/mp4"
          />
          <a href="/assets/videos/xarm/pick-up-block.mp4">Pick Up Block</a>
        </video>
      </section>
    </main>
  </body>
</html>
